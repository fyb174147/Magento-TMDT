services:
  db:
    image: mysql:8.0
    container_name: magento-db
    environment:
      # Sử dụng biến từ file .env
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: magento-os
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=${OS_JAVA_OPTS}"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    deploy:
      resources:
        limits:
          memory: 1.5G
    restart: always

  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: magento-php
    volumes:
      - ./src:/var/www/html
    environment:
      # Tăng giới hạn RAM cho PHP để fix lỗi Admin lag
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT}
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      - db
      - opensearch
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: magento-nginx
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - db
    restart: always

volumes:
  db_data: