<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label">
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>
    <div class="payment-method-content">
        <div class="bookstore-vietqr">
            <div class="qr-code-wrapper">
                <img data-bind="attr: {src: getQrUrl(), alt: 'VietQR'}" width="220" height="220"/>
            </div>
            <div class="qr-info">
                <div>
                    <h4>Quét mã VietQR để chuyển khoản</h4>
                    <p>Vui lòng chuyển khoản đúng số tiền và nội dung bên dưới, sau đó xác nhận để đặt hàng.</p>
                </div>
                <div class="qr-row">
                    <span>Ngân hàng</span>
                    <strong data-bind="text: bankName + ' (' + bankId + ')'"></strong>
                </div>
                <div class="qr-row">
                    <span>Số tài khoản</span>
                    <strong data-bind="text: accountNo"></strong>
                </div>
                <div class="qr-row">
                    <span>Chủ tài khoản</span>
                    <strong data-bind="text: accountName"></strong>
                </div>
                <div class="qr-row">
                    <span>Số tiền</span>
                    <strong data-bind="text: getFormattedAmount()"></strong>
                </div>
                <div class="qr-row">
                    <span>Nội dung</span>
                    <strong data-bind="text: getTransferContent()"></strong>
                </div>
                <label class="qr-confirm">
                    <input type="checkbox" data-bind="checked: transferConfirmed"/>
                    <span>Tôi đã chuyển khoản đúng số tiền và nội dung ở trên</span>
                </label>
                <button type="button"
                        class="btn-confirm-payment"
                        data-bind="click: placeOrder, enable: canConfirmPayment(), attr: {title: 'Xác nhận thanh toán VietQR'}">
                    <span>Xác nhận và đặt hàng</span>
                </button>
            </div>
        </div>
    </div>
</div>
